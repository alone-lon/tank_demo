<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>坦克大战</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 游戏主容器 -->
  <div id="game-container">
    <!-- 顶部 HUD -->
    <div id="hud">
      <div class="hud-item">
        <span class="hud-label">分数</span>
        <span id="score-display" class="hud-value">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">生命</span>
        <span id="lives-display" class="hud-value lives-green">♥♥♥</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">敌方剩余</span>
        <span id="enemies-display" class="hud-value">4</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">波次</span>
        <span id="wave-display" class="hud-value">1</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">关卡</span>
        <span id="level-display" class="hud-value">1</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">进度</span>
        <span id="progress-display" class="hud-value">0/20</span>
      </div>
    </div>
    <!-- Canvas 画布 -->
    <canvas id="gameCanvas" width="520" height="520"></canvas>
    <!-- 移动端触控面板 -->
    <div id="touch-controls">
      <!-- 方向键 -->
      <div class="dpad">
        <div class="dpad-empty"></div>
        <button class="dpad-btn" data-key="ArrowUp">▲</button>
        <div class="dpad-empty"></div>
        <button class="dpad-btn" data-key="ArrowLeft">◀</button>
        <div class="dpad-empty"></div>
        <button class="dpad-btn" data-key="ArrowRight">▶</button>
        <div class="dpad-empty"></div>
        <button class="dpad-btn" data-key="ArrowDown">▼</button>
        <div class="dpad-empty"></div>
      </div>
      <!-- 射击按钮 -->
      <button class="fire-btn" data-key="Space">射击</button>
    </div>
    <!-- 覆盖层：开始界面 / 游戏结束 -->
    <div id="overlay" class="overlay">
      <div id="overlay-content" class="overlay-content">
        <h1 id="overlay-title">🎮 坦克大战</h1>
        <p id="overlay-subtitle">WASD / 方向键移动 · 空格射击 · 回车开始</p>
        <p id="overlay-hint" class="hint-text">按 <kbd>回车</kbd> 开始游戏</p>
        <p id="overlay-score" class="final-score" style="display:none;"></p>
      </div>
    </div>
  </div>
  <script src="main.js?v=1.77"></script>
</body>
</html>
